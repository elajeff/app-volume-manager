[project]
name = "app-volume-manager"
version = "0.1.0"
description = "Per-application audio session volume rules for Windows"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv", ".venv-build", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The tests call their closures inside the loop that defines them.
"tests/*" = ["B023"]
